<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Języki interpretowane — nauka</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="app">
    <section id="start" class="screen active">
      <div class="hero">
        <p class="eyebrow">Kolokwium • Języki interpretowane</p>
        <h1>Ucz się aktywnie, nie przez samo czytanie.</h1>
        <p class="lead">Wybierz dział, przerabiaj fiszki, oznaczaj trudne pytania i sprawdź się w szybkim quizie.</p>
      </div>
      <div class="stats-grid">
        <div class="stat"><span id="totalCards">0</span><small>pytań</small></div>
        <div class="stat"><span id="knownCards">0</span><small>umiem</small></div>
        <div class="stat"><span id="hardCards">0</span><small>trudne</small></div>
      </div>
      <h2>Wybierz etap</h2>
      <div id="stages" class="stage-grid"></div>
      <div class="toolbar">
        <button class="ghost" id="quizStartBtn">Szybki quiz</button>
        <button class="ghost" id="resetStats">Wyczyść postęp</button>
      </div>
    </section>

    <section id="learn" class="screen">
      <header class="topbar">
        <button class="back" id="backBtn">← Etapy</button>
        <div>
          <p class="eyebrow" id="modeLabel">Tryb nauki</p>
          <h2 id="stageTitle">Dział</h2>
        </div>
        <button class="ghost" id="shuffleBtn">Losuj</button>
      </header>
      <div class="progress-wrap"><div id="progress" class="progress"></div></div>
      <div class="card">
        <div class="card-meta"><span id="counter">1 / 1</span><span id="categoryPill"></span></div>
        <h1 id="question">Pytanie</h1>
        <div id="answer" class="answer hidden"></div>
        <div class="actions">
          <button id="showBtn" class="primary">Pokaż odpowiedź</button>
          <button id="againBtn" class="danger hidden">Nie umiem</button>
          <button id="okBtn" class="success hidden">Umiem</button>
        </div>
      </div>
      <div class="mini-panel">
        <button id="prevBtn">Poprzednie</button>
        <button id="nextBtn">Następne</button>
        <button id="hardOnlyBtn">Powtarzaj trudne</button>
        <button id="quizFromStageBtn">Quiz z tego działu</button>
      </div>
    </section>

    <section id="quiz" class="screen">
      <header class="topbar">
        <button class="back" id="quizBackBtn">← Etapy</button>
        <div>
          <p class="eyebrow">Tryb quizu</p>
          <h2 id="quizTitle">Sprawdź się</h2>
        </div>
        <button class="ghost" id="restartQuizBtn">Od nowa</button>
      </header>
      <div class="progress-wrap"><div id="quizProgress" class="progress"></div></div>
      <div class="card quiz-card">
        <div class="card-meta"><span id="quizCounter">1 / 1</span><span id="quizScore">Wynik: 0</span></div>
        <h1 id="quizQuestion">Pytanie</h1>
        <div id="quizOptions" class="options"></div>
        <div id="quizFeedback" class="answer hidden"></div>
        <div class="actions">
          <button id="quizNextBtn" class="primary hidden">Następne pytanie</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
